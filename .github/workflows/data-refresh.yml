name: Refresh game data

# Re-pulls bundled lookup tables from upstream (repoe-fork/poe2 and
# PathOfBuilding-PoE2) and opens a PR when anything changed. Runs every
# Monday at 06:00 UTC and on demand via the Actions tab. PR-based so a
# human eyeballs the diff before it ships.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch raw data
        run: pnpm fetch-data

      - name: Prune to bundled shape
        run: pnpm prune-data

      - name: Verify the refreshed data (typecheck, build, test)
        # Mirrors ci.yml. Auto-PRs opened with the default GITHUB_TOKEN do
        # NOT trigger the separate CI workflow — GitHub blocks token-created
        # events from starting new runs to prevent recursion — so we verify
        # here instead. A red run means the new upstream data broke
        # something, usually a passive-id format change that needs a tweak
        # in packages/core/src/map.ts.
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Open PR if data changed
        # always() so the diff PR still opens even when verification above
        # went red — you want to see what upstream changed in order to fix
        # it. The red workflow run is the signal that a fix is needed.
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          title: 'chore(data): refresh from upstream'
          branch: data-refresh
          base: main
          delete-branch: true
          commit-message: 'chore(data): refresh from upstream'
          # Only ever commit data files — keeps build artifacts (dist/) and
          # anything else out of the auto-PR.
          add-paths: packages/core/data/**
          labels: data, automated
          body: |
            Automated refresh of bundled game data, triggered by the
            **Refresh game data** workflow.

            ## What changed

            The diff shows which raw/ and pruned/ files moved since the
            last refresh. Most refreshes only touch `_manifest.json` if
            upstream data is byte-for-byte stable; meaningful diffs in
            the JSON payloads indicate a real upstream patch.

            ## Sources pulled

            - `repoe-fork/poe2` (master) — auto-tracking dumps of PoE2
              game tables.
            - `PathOfBuilding-PoE2` (dev) — versioned passive tree data
              (currently `0_4`) and the canonical gem-name lookup from
              `src/Data/Gems.lua`.

            ## Reviewer checklist

            - [ ] `_manifest.json` `fetched_at` advances.
            - [ ] The refresh workflow run that opened this PR is green —
              typecheck/build/test ran against this data inside the
              workflow (auto-PRs can't trigger the separate CI workflow).
              A red run means the new data broke something.
            - [ ] If a passive-id format changed (rare), the converter
              may need a mapper tweak — check `packages/core/src/map.ts`.
